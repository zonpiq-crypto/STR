<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
    <style>
        body {
            background-color: #bc2121;
            font-family: Arial;
        }
        h1 {
            text-align: center;
        }
        form {
            width: 60%;
            margin: auto;
        }
        label {
            display: inline-block;
            width: 150px;
            margin-top: 10px;
        }
        input, select, textarea {
            padding: 5px;
            margin-top: 10px;
        }
        .inline {
            display: inline;
            width: auto;
        }
        button {
            margin-top: 20px;
            padding: 8px 15px;
        }
    </style>
</head>
<body>

<h1>Student Registration Form</h1>

<form>
    <label>Roll no:</label>
    <input type="text"><br>

    <label>Student name:</label>
    <input type="text" placeholder="First Name">
    -
    <input type="text" placeholder="Last Name"><br>

    <label>Father's name:</label>
    <input type="text"><br>

    <label>Date of birth:</label>
    <input type="text" placeholder="Day" size="4">
    -
    <input type="text" placeholder="Month" size="6">
    -
    <input type="text" placeholder="Year" size="6">
    (DD-MM-YYYY)<br>

    <label>Mobile no:</label>
    +91 -
    <input type="text"><br>

    <label>Email id:</label>
    <input type="email"><br>

    <label>Password:</label>
    <input type="password"><br>

    <label>Gender:</label>
    <input type="radio" name="gender" class="inline"> Male
    <input type="radio" name="gender" class="inline"> Female<br>

    <label>Department:</label>
    <input type="checkbox" class="inline"> CSE
    <input type="checkbox" class="inline"> IT
    <input type="checkbox" class="inline"> ECE
    <input type="checkbox" class="inline"> Civil
    <input type="checkbox" class="inline"> Mech<br>

    <label>Course:</label>
    <select>
        <option>--------- Select Current Course ---------</option>
        <option>Computer Science</option>
        <option>Information Technology</option>
        <option>Electronics</option>
    </select><br>

    <label>Student photo:</label>
    <input type="file"><br>

    <label>City:</label>
    <input type="text"><br>

    <label>Address:</label><br>
    <textarea rows="4" cols="40"></textarea><br>

    <center>
        <button type="submit">Register</button>
    </center>
</form>

</body>
</html>
</body>
</html>
